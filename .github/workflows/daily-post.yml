name: Günlük Instagram Gönderisi

on:
  schedule:
    # UTC saat 07:00 = Türkiye saatiyle 10:00 (yaz/kış saatine göre 3 saat fark)
    # Farklı bir saat istersen buradaki cron ifadesini değiştir: dakika saat gün ay haftagünü
   - cron: "30 14 * * *"
  workflow_dispatch: {}  # İstersen Actions sekmesinden elle de tetikleyebilirsin

permissions:
  contents: write  # queue.json'daki "posted" durumunu commit edebilmek için

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Gönderiyi yayınla
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/post_to_instagram.py

      - name: Kuyruk durumunu kaydet
        run: |
          git config user.name "ig-autopost-bot"
          git config user.email "actions@github.com"
          git add content_queue/queue.json
          git diff --cached --quiet || git commit -m "chore: gönderi yayınlandı olarak işaretlendi [skip ci]"
          git push
